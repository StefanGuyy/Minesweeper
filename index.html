<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minesweeper</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --cell-hidden: #334155;
            --cell-hover: #475569;
            --cell-revealed: #0f172a;
            --danger-color: #f43f5e;
            --danger-dark: #9f1239;
            --danger-light: #fda4af;
            --success-color: #10b981;
            --easy-color: #86efac;
            --medium-color: #fde047;
            --hard-color: #fca5a5;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px;
            box-sizing: border-box;
        }

        .game-container {
            background-color: var(--panel-color);
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            max-height: 100vh;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 6px;
            font-size: 1rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .face-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 6px;
            border-radius: 4px;
            transition: transform 0.1s;
        }

        .face-btn:active {
            transform: scale(0.9);
        }

        .board {
            display: grid;
            gap: 2px;
            background-color: #0f172a;
            padding: 4px;
            border-radius: 6px;
        }

        .cell {
            background-color: var(--cell-hidden);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .cell:hover {
            background-color: var(--cell-hover);
        }

        .cell.revealed {
            background-color: var(--cell-revealed);
            cursor: default;
        }

        .cell.mine {
            background-color: var(--danger-dark);
        }

        .cell.correct-flag {
            background-color: var(--danger-light);
        }

        .cell.flagged {
            background-color: #334155;
        }

        /* Number colors */
        .c-1 { color: #60a5fa; }
        .c-2 { color: #34d399; }
        .c-3 { color: #f87171; }
        .c-4 { color: #c084fc; }
        .c-5 { color: #fbbf24; }
        .c-6 { color: #22d3ee; }
        .c-7 { color: #f472b6; }
        .c-8 { color: #94a3b8; }

        .status-msg {
            margin-top: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            min-height: 18px;
            text-align: center;
        }

        /* Mode Switch Button */
        .mode-switch-btn {
            width: 100%;
            margin-top: 6px;
            padding: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #334155;
            border: 2px solid #475569;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.15s, border-color 0.15s, transform 0.05s;
            box-sizing: border-box;
        }

        .mode-switch-btn:active {
            transform: scale(0.97);
        }

        .mode-switch-btn.mode-flag {
            background-color: #9f1239;
            border-color: #f43f5e;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
        }

        .difficulty-panel {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            width: 100%;
            justify-content: center;
        }

        .diff-btn {
            border: none;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            color: #0f172a;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.1s;
        }

        .diff-btn.active {
            opacity: 1;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        .diff-btn:active {
            transform: scale(0.95);
        }

        .btn-easy { background-color: var(--easy-color); }
        .btn-normal { background-color: var(--medium-color); }
        .btn-hard { background-color: var(--hard-color); }

        /* Mobile Layout Adjustments for Hard/Expert Mode */
        @media screen and (max-width: 768px) {
            .game-container.layout-hard {
                flex-direction: row;
                align-items: stretch;
                gap: 10px;
                padding: 8px;
                max-width: 100vw;
                max-height: 100vh;
            }

            .game-container.layout-hard .side-panel {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                width: 130px;
                flex-shrink: 0;
            }

            .game-container.layout-hard .board-wrapper {
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .game-container.layout-hard .difficulty-panel {
                flex-direction: column;
                gap: 4px;
            }

            .game-container.layout-hard .diff-btn {
                width: 100%;
                padding: 4px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="game-container" id="game-container">
        <!-- Main Board Wrapper -->
        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>

        <!-- Side / Bottom Control Panel -->
        <div class="side-panel" id="side-panel">
            <div class="header">
                <div>🚩 <span id="flags-left">10</span></div>
                <button class="face-btn" id="face-btn" onclick="initGame()">😊</button>
                <div>⏱️ <span id="timer">0</span>s</div>
            </div>

            <button class="mode-switch-btn" id="mode-btn" onclick="toggleMode()">
                ⛏️ Mode: Digging
            </button>

            <div class="status-msg" id="status-msg"></div>

            <div class="difficulty-panel">
                <button class="diff-btn btn-easy active" onclick="setDifficulty('easy')">Easy</button>
                <button class="diff-btn btn-normal" onclick="setDifficulty('normal')">Normal</button>
                <button class="diff-btn btn-hard" onclick="setDifficulty('hard')">Hard</button>
            </div>
        </div>
    </div>

<script>
    let currentDiff = 'easy';
    let configs = {
        easy: { rows: 9, cols: 9, mines: 10, cellSize: 32, fontSize: '1.1rem' },
        normal: { rows: 16, cols: 16, mines: 40, cellSize: 20, fontSize: '0.8rem' },
        hard: { rows: 30, cols: 16, mines: 99, cellSize: 20, fontSize: '0.8rem' } // Larger cell size for mobile landscape expert mode
    };

    let ROWS = configs.easy.rows;
    let COLS = configs.easy.cols;
    let MINES = configs.easy.mines;

    let board = [];
    let gameOver = false;
    let gameWon = false;
    let flagsCount = MINES;
    let timer = 0;
    let timerInterval = null;
    let gameStarted = false;
    let isFlagMode = false;

    const gameContainer = document.getElementById('game-container');
    const boardElement = document.getElementById('board');
    const flagsElement = document.getElementById('flags-left');
    const timerElement = document.getElementById('timer');
    const statusMsgElement = document.getElementById('status-msg');
    const faceBtn = document.getElementById('face-btn');
    const modeBtn = document.getElementById('mode-btn');

    function toggleMode() {
        isFlagMode = !isFlagMode;
        if (isFlagMode) {
            modeBtn.textContent = '🚩 Mode: Flagging';
            modeBtn.classList.add('mode-flag');
        } else {
            modeBtn.textContent = '⛏️ Mode: Digging';
            modeBtn.classList.remove('mode-flag');
        }
    }

    function setDifficulty(diff) {
        currentDiff = diff;
        ROWS = configs[diff].rows;
        COLS = configs[diff].cols;
        MINES = configs[diff].mines;

        if (diff === 'hard') {
            gameContainer.classList.add('layout-hard');
        } else {
            gameContainer.classList.remove('layout-hard');
        }

        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector('.btn-' + diff).classList.add('active');

        initGame();
    }

    function initGame() {
        boardElement.style.gridTemplateColumns = `repeat(${COLS}, ${configs[currentDiff].cellSize}px)`;
        boardElement.style.gridTemplateRows = `repeat(${ROWS}, ${configs[currentDiff].cellSize}px)`;

        boardElement.innerHTML = '';
        board = [];
        gameOver = false;
        gameWon = false;
        flagsCount = MINES;
        timer = 0;
        gameStarted = false;
        clearInterval(timerInterval);
        timerElement.textContent = timer;
        flagsElement.textContent = flagsCount;
        statusMsgElement.textContent = '';
        statusMsgElement.style.color = '#f8fafc';
        faceBtn.textContent = '😊';

        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) {
                let cellData = {
                    row: r,
                    col: c,
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    adjacentMines: 0
                };
                row.push(cellData);
                
                const cellEl = document.createElement('div');
                cellEl.classList.add('cell');
                cellEl.style.fontSize = configs[currentDiff].fontSize;
                cellEl.dataset.row = r;
                cellEl.dataset.col = c;
                
                cellEl.addEventListener('click', () => {
                    if (isFlagMode) {
                        handleCellRightClick(r, c);
                    } else {
                        handleCellClick(r, c);
                    }
                });

                cellEl.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    handleCellRightClick(r, c);
                });

                boardElement.appendChild(cellEl);
            }
            board.push(row);
        }
    }

    function placeMines(firstR, firstC) {
        let placed = 0;
        while (placed < MINES) {
            let r = Math.floor(Math.random() * ROWS);
            let c = Math.floor(Math.random() * COLS);
            if (!board[r][c].isMine && !(Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1)) {
                board[r][c].isMine = true;
                placed++;
            }
        }

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!board[r][c].isMine) {
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].adjacentMines = count;
                }
            }
        }
    }

    function handleCellClick(r, c) {
        if (gameOver || gameWon) return;

        if (board[r][c].isRevealed && board[r][c].adjacentMines > 0) {
            chordCell(r, c);
            return;
        }

        if (board[r][c].isFlagged || board[r][c].isRevealed) return;

        if (!gameStarted) {
            gameStarted = true;
            placeMines(r, c);
            timerInterval = setInterval(() => {
                timer++;
                timerElement.textContent = timer;
            }, 1000);
        }

        if (board[r][c].isMine) {
            gameOver = true;
            clearInterval(timerInterval);
            faceBtn.textContent = '😵';
            statusMsgElement.textContent = "💥 Game Over!";
            statusMsgElement.style.color = "var(--danger-color)";
            renderBoard();
            return;
        }

        revealCellRecursive(r, c);
        checkWinCondition();
        renderBoard();
    }

    function chordCell(r, c) {
        let flagCount = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    if (board[nr][nc].isFlagged) flagCount++;
                }
            }
        }

        if (flagCount === board[r][c].adjacentMines) {
            let hitMine = false;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (!board[nr][nc].isFlagged && !board[nr][nc].isRevealed) {
                            if (board[nr][nc].isMine) {
                                hitMine = true;
                            } else {
                                revealCellRecursive(nr, nc);
                            }
                        }
                    }
                }
            }

            if (hitMine) {
                gameOver = true;
                clearInterval(timerInterval);
                faceBtn.textContent = '😵';
                statusMsgElement.textContent = "💥 Game Over!";
                statusMsgElement.style.color = "var(--danger-color)";
            } else {
                checkWinCondition();
            }
            renderBoard();
        }
    }

    function revealCellRecursive(r, c) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS || board[r][c].isRevealed || board[r][c].isFlagged) return;

        board[r][c].isRevealed = true;

        if (board[r][c].adjacentMines === 0) {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    revealCellRecursive(r + dr, c + dc);
                }
            }
        }
    }

    function handleCellRightClick(r, c) {
        if (gameOver || gameWon || board[r][c].isRevealed) return;

        board[r][c].isFlagged = !board[r][c].isFlagged;
        flagsCount += board[r][c].isFlagged ? -1 : 1;
        flagsElement.textContent = flagsCount;
        renderBoard();
    }

    function checkWinCondition() {
        let unrevealedSafe = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!board[r][c].isMine && !board[r][c].isRevealed) {
                    unrevealedSafe++;
                }
            }
        }
        if (unrevealedSafe === 0) {
            gameWon = true;
            clearInterval(timerInterval);
            faceBtn.textContent = '😎';
            statusMsgElement.textContent = `🎉 You Won in ${timer}s!`;
            statusMsgElement.style.color = "var(--success-color)";
        }
    }

    function renderBoard() {
        const cellElements = boardElement.children;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cellData = board[r][c];
                const index = r * COLS + c;
                const cellEl = cellElements[index];

                cellEl.className = 'cell';
                cellEl.style.fontSize = configs[currentDiff].fontSize;
                cellEl.textContent = '';

                if (gameOver) {
                    if (cellData.isMine && cellData.isFlagged) {
                        cellEl.classList.add('correct-flag');
                        cellEl.textContent = '🚩';
                    } else if (cellData.isMine) {
                        cellEl.classList.add('mine');
                        cellEl.textContent = '💣';
                    } else if (cellData.isFlagged) {
                        cellEl.classList.add('revealed');
                        cellEl.textContent = '❌';
                    } else if (cellData.isRevealed) {
                        cellEl.classList.add('revealed');
                        if (cellData.adjacentMines > 0) {
                            cellEl.textContent = cellData.adjacentMines;
                            cellEl.classList.add(`c-${cellData.adjacentMines}`);
                        }
                    }
                } else {
                    if (cellData.isRevealed) {
                        cellEl.classList.add('revealed');
                        if (cellData.isMine) {
                            cellEl.classList.add('mine');
                            cellEl.textContent = '💣';
                        } else if (cellData.adjacentMines > 0) {
                            cellEl.textContent = cellData.adjacentMines;
                            cellEl.classList.add(`c-${cellData.adjacentMines}`);
                        }
                    } else if (cellData.isFlagged) {
                        cellEl.classList.add('flagged');
                        cellEl.textContent = '🚩';
                    }
                }
            }
        }
    }

    initGame();
</script>

</body>
</html>

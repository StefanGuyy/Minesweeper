<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --cell-hidden: #334155;
            --cell-hover: #475569;
            --cell-revealed: #0f172a;
            --accent-color: #38bdf8;
            --danger-color: #f43f5e;
            --danger-dark: #9f1239;
            --danger-light: #fda4af;
            --success-color: #10b981;
            --easy-color: #86efac;
            --medium-color: #fde047;
            --hard-color: #fca5a5;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-container {
            background-color: var(--panel-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 16px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .face-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 8px;
            border-radius: 6px;
            transition: transform 0.1s;
        }

        .face-btn:active {
            transform: scale(0.9);
        }

        .board {
            display: grid;
            gap: 4px;
            background-color: #0f172a;
            padding: 6px;
            border-radius: 8px;
        }

        .cell {
            background-color: var(--cell-hidden);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.25rem; /* Larger font size for numbers */
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .cell:hover {
            background-color: var(--cell-hover);
        }

        .cell.revealed {
            background-color: var(--cell-revealed);
            cursor: default;
        }

        .cell.mine {
            background-color: var(--danger-dark);
        }

        .cell.correct-flag {
            background-color: var(--danger-light);
        }

        .cell.flagged {
            background-color: #334155;
        }

        /* Number colors */
        .c-1 { color: #60a5fa; }
        .c-2 { color: #34d399; }
        .c-3 { color: #f87171; }
        .c-4 { color: #c084fc; }
        .c-5 { color: #fbbf24; }
        .c-6 { color: #22d3ee; }
        .c-7 { color: #f472b6; }
        .c-8 { color: #94a3b8; }

        .status-msg {
            margin-top: 12px;
            font-weight: bold;
            min-height: 24px;
        }

        .difficulty-panel {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .diff-btn {
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            color: #0f172a;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.1s;
        }

        .diff-btn.active {
            opacity: 1;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .diff-btn:active {
            transform: scale(0.95);
        }

        .btn-easy { background-color: var(--easy-color); }
        .btn-normal { background-color: var(--medium-color); }
        .btn-hard { background-color: var(--hard-color); }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div>🚩 <span id="flags-left">10</span></div>
            <button class="face-btn" id="face-btn" onclick="initGame()">😊</button>
            <div>⏱️ <span id="timer">0</span>s</div>
        </div>

        <div class="board" id="board"></div>

        <div class="status-msg" id="status-msg"></div>

        <div class="difficulty-panel">
            <button class="diff-btn btn-easy active" onclick="setDifficulty('easy')">Easy</button>
            <button class="diff-btn btn-normal" onclick="setDifficulty('normal')">Normal</button>
            <button class="diff-btn btn-hard" onclick="setDifficulty('hard')">Hard</button>
        </div>
    </div>

<script>
    let currentDiff = 'easy';
    let configs = {
        easy: { rows: 9, cols: 9, mines: 10, cellSize: 38 },
        normal: { rows: 16, cols: 16, mines: 40, cellSize: 30 },
        hard: { rows: 30, cols: 16, mines: 99, cellSize: 22 }
    };

    let ROWS = configs.easy.rows;
    let COLS = configs.easy.cols;
    let MINES = configs.easy.mines;

    let board = [];
    let gameOver = false;
    let gameWon = false;
    let flagsCount = MINES;
    let timer = 0;
    let timerInterval = null;
    let gameStarted = false;

    const boardElement = document.getElementById('board');
    const flagsElement = document.getElementById('flags-left');
    const timerElement = document.getElementById('timer');
    const statusMsgElement = document.getElementById('status-msg');
    const faceBtn = document.getElementById('face-btn');

    function setDifficulty(diff) {
        currentDiff = diff;
        ROWS = configs[diff].rows;
        COLS = configs[diff].cols;
        MINES = configs[diff].mines;

        document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector('.btn-' + diff).classList.add('active');

        initGame();
    }

    function initGame() {
        boardElement.style.gridTemplateColumns = `repeat(${COLS}, ${configs[currentDiff].cellSize}px)`;
        boardElement.style.gridTemplateRows = `repeat(${ROWS}, ${configs[currentDiff].cellSize}px)`;

        boardElement.innerHTML = '';
        board = [];
        gameOver = false;
        gameWon = false;
        flagsCount = MINES;
        timer = 0;
        gameStarted = false;
        clearInterval(timerInterval);
        timerElement.textContent = timer;
        flagsElement.textContent = flagsCount;
        statusMsgElement.textContent = '';
        statusMsgElement.style.color = '#f8fafc';
        faceBtn.textContent = '😊';

        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) {
                let cellData = {
                    row: r,
                    col: c,
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    adjacentMines: 0
                };
                row.push(cellData);
                
                const cellEl = document.createElement('div');
                cellEl.classList.add('cell');
                // Scaled font sizes to make numbers nice and big while fitting the grid
                cellEl.style.fontSize = currentDiff === 'hard' ? '0.9rem' : (currentDiff === 'normal' ? '1.1rem' : '1.3rem');
                cellEl.dataset.row = r;
                cellEl.dataset.col = c;
                
                cellEl.addEventListener('click', () => handleCellClick(r, c));
                cellEl.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    handleCellRightClick(r, c);
                });

                boardElement.appendChild(cellEl);
            }
            board.push(row);
        }
    }

    function placeMines(firstR, firstC) {
        let placed = 0;
        while (placed < MINES) {
            let r = Math.floor(Math.random() * ROWS);
            let c = Math.floor(Math.random() * COLS);
            if (!board[r][c].isMine && !(Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1)) {
                board[r][c].isMine = true;
                placed++;
            }
        }

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!board[r][c].isMine) {
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            let nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].adjacentMines = count;
                }
            }
        }
    }

    function handleCellClick(r, c) {
        if (gameOver || gameWon) return;

        if (board[r][c].isRevealed && board[r][c].adjacentMines > 0) {
            chordCell(r, c);
            return;
        }

        if (board[r][c].isFlagged || board[r][c].isRevealed) return;

        if (!gameStarted) {
            gameStarted = true;
            placeMines(r, c);
            timerInterval = setInterval(() => {
                timer++;
                timerElement.textContent = timer;
            }, 1000);
        }

        if (board[r][c].isMine) {
            gameOver = true;
            clearInterval(timerInterval);
            faceBtn.textContent = '😵';
            statusMsgElement.textContent = "💥 Game Over!";
            statusMsgElement.style.color = "var(--danger-color)";
            renderBoard();
            return;
        }

        revealCellRecursive(r, c);
        checkWinCondition();
        renderBoard();
    }

    function chordCell(r, c) {
        let flagCount = 0;
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    if (board[nr][nc].isFlagged) flagCount++;
                }
            }
        }

        if (flagCount === board[r][c].adjacentMines) {
            let hitMine = false;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dr++) { // wait, let dc = -1; dc <= 1; dc++
                    // fixing inline loop error from copy paste
                }
            }
            // Quick safety patch for inner loops
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (!board[nr][nc].isFlagged && !board[nr][nc].isRevealed) {
                            if (board[nr][nc].isMine) {
                                hitMine = true;
                            } else {
                                revealCellRecursive(nr, nc);
                            }
                        }
                    }
                }
            }

            if (hitMine) {
                gameOver = true;
                clearInterval(timerInterval);
                faceBtn.textContent = '😵';
                statusMsgElement.textContent = "💥 Game Over!";
                statusMsgElement.style.color = "var(--danger-color)";
            } else {
                checkWinCondition();
            }
            renderBoard();
        }
    }

    function revealCellRecursive(r, c) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS || board[r][c].isRevealed || board[r][c].isFlagged) return;

        board[r][c].isRevealed = true;

        if (board[r][c].adjacentMines === 0) {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    revealCellRecursive(r + dr, c + dc);
                }
            }
        }
    }

    function handleCellRightClick(r, c) {
        if (gameOver || gameWon || board[r][c].isRevealed) return;

        board[r][c].isFlagged = !board[r][c].isFlagged;
        flagsCount += board[r][c].isFlagged ? -1 : 1;
        flagsElement.textContent = flagsCount;
        renderBoard();
    }

    function checkWinCondition() {
        let unrevealedSafe = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!board[r][c].isMine && !board[r][c].isRevealed) {
                    unrevealedSafe++;
                }
            }
        }
        if (unrevealedSafe === 0) {
            gameWon = true;
            clearInterval(timerInterval);
            faceBtn.textContent = '😎';
            statusMsgElement.textContent = `🎉 You Won in ${timer}s!`;
            statusMsgElement.style.color = "var(--success-color)";
        }
    }

    function renderBoard() {
        const cellElements = boardElement.children;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cellData = board[r][c];
                const index = r * COLS + c;
                const cellEl = cellElements[index];

                cellEl.className = 'cell';
                cellEl.style.fontSize = currentDiff === 'hard' ? '0.9rem' : (currentDiff === 'normal' ? '1.1rem' : '1.3rem');
                cellEl.textContent = '';

                if (gameOver) {
                    if (cellData.isMine && cellData.isFlagged) {
                        cellEl.classList.add('correct-flag');
                        cellEl.textContent = '🚩';
                    } else if (cellData.isMine) {
                        cellEl.classList.add('mine');
                        cellEl.textContent = '💣';
                    } else if (cellData.isFlagged) {
                        cellEl.classList.add('revealed');
                        cellEl.textContent = '❌';
                    } else if (cellData.isRevealed) {
                        cellEl.classList.add('revealed');
                        if (cellData.adjacentMines > 0) {
                            cellEl.textContent = cellData.adjacentMines;
                            cellEl.classList.add(`c-${cellData.adjacentMines}`);
                        }
                    }
                } else {
                    if (cellData.isRevealed) {
                        cellEl.classList.add('revealed');
                        if (cellData.isMine) {
                            cellEl.classList.add('mine');
                            cellEl.textContent = '💣';
                        } else if (cellData.adjacentMines > 0) {
                            cellEl.textContent = cellData.adjacentMines;
                            cellEl.classList.add(`c-${cellData.adjacentMines}`);
                        }
                    } else if (cellData.isFlagged) {
                        cellEl.classList.add('flagged');
                        cellEl.textContent = '🚩';
                    }
                }
            }
        }
    }

    initGame();
</script>

</body>
</html>
